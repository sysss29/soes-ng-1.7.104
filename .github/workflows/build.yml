name: Build SOES-NG for Skyrim 1.7.104

# Rebuilds the Skyrim Outfit Equipment System NG SKSE plugin (koukibyou, CC-BY-NC-SA-4.0)
# against CommonLibSSE-NG v12.1.0, which supports the Address Library v5 format used by
# Skyrim 1.7.99 / 1.7.104. Source: https://github.com/koukisdevki/SkyrimOutfitEquipmentSystemNG

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  SOES_REPO: https://github.com/koukisdevki/SkyrimOutfitEquipmentSystemNG.git
  SOES_COMMIT: 5201a5fdfc7b1139e6a3747a0bc1ccc12be2703e
  COMMONLIB_TAG: v12.1.0
  # vcpkg tool/scripts version: the baseline CommonLibSSE-NG v12.1.0 itself builds with.
  VCPKG_COMMIT: ee12231b20c95013c6638d845d04c91559a1d1ff
  # Papyrus toolchain (compile-time only)
  CAPRICA_COMMIT: 9cd6d32ec2750adae329e81f7276dac95251e000
  NL_ONLINE_COMMIT: 579cec203d4dcd093f6f01a6cb1d0851a5194a9a
  GRIMY_COMMIT: 4ba71332b4851985240f582a76017216a3bd452f

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 150

    steps:
      - name: Check out this repository (patch + workflow)
        uses: actions/checkout@v4
        with:
          path: wrapper

      - name: Fetch SOES-NG source and CommonLibSSE-NG ${{ env.COMMONLIB_TAG }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git -c core.autocrlf=false clone $env:SOES_REPO soes
          cd soes
          git -c core.autocrlf=false checkout $env:SOES_COMMIT
          git -c core.autocrlf=false submodule update --init extern/CommonLibVR-ng
          cd extern/CommonLibVR-ng
          git fetch --tags origin
          git -c core.autocrlf=false checkout $env:COMMONLIB_TAG
          git -c core.autocrlf=false submodule update --init --recursive
          git log -1 --format='CommonLib at %h %ad %s' --date=short

      - name: Apply 1.7.104 patch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cd soes
          git apply --verbose ../wrapper/patches/soes-1.7.104.patch
          if ($LASTEXITCODE -ne 0) { throw "Patch failed to apply" }

      - name: Get CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Set up MSVC environment
        uses: TheMrMilchmann/setup-msvc-dev@v4.0.0
        with:
          arch: x64

      - name: Pin vcpkg cache directories
        shell: bash
        run: |
          echo "VCPKG_DOWNLOADS=${{ github.workspace }}/vcpkg_downloads" >> "$GITHUB_ENV"
          echo "VCPKG_DEFAULT_BINARY_CACHE=${{ github.workspace }}/vcpkg_binary_cache" >> "$GITHUB_ENV"
          mkdir -p "${{ github.workspace }}/vcpkg_downloads" "${{ github.workspace }}/vcpkg_binary_cache"

      - name: Cache vcpkg packages (speeds up re-runs)
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/vcpkg_downloads
            ${{ github.workspace }}/vcpkg_binary_cache
          key: vcpkg-${{ env.VCPKG_COMMIT }}-${{ hashFiles('wrapper/patches/*.patch') }}
          restore-keys: |
            vcpkg-${{ env.VCPKG_COMMIT }}-

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}
          runVcpkgInstall: false

      - name: Configure (installs dependencies; retried for flaky downloads)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 60
          max_attempts: 3
          retry_wait_seconds: 30
          shell: pwsh
          command: |
            # Build CommonLib from source instead of downloading its prebuilt bundle, so it is
            # compiled with exactly the same dependency versions as the plugin.
            Remove-Item Env:GITHUB_ACTIONS -ErrorAction SilentlyContinue
            cd soes
            cmake --preset build-release-msvc `
              -DVCPKG_MANIFEST_NO_DEFAULT_FEATURES=ON `
              "-DVCPKG_MANIFEST_FEATURES=plugin" `
              -DCOMMONLIB_ENABLE_IPO=OFF `
              -DBUILD_TESTS=OFF

      - name: Build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item Env:GITHUB_ACTIONS -ErrorAction SilentlyContinue
          cd soes
          cmake --build --preset release-msvc
          if ($LASTEXITCODE -ne 0) { throw "Build failed" }

      # ---------------------------------------------------------------------------------------
      # Papyrus scripts: compiled with Caprica (open-source, MIT) against public script headers,
      # so no Creation Kit is needed. Headers are used for compiling only and never shipped.
      # ---------------------------------------------------------------------------------------
      - name: Build Caprica (Papyrus compiler)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git clone https://github.com/nikitalita/Caprica.git caprica
          git -C caprica checkout $env:CAPRICA_COMMIT
          # Caprica pins a 2023 vcpkg baseline whose Boost no longer builds with current MSVC;
          # use the same (newer) baseline as the DLL build instead.
          $manifest = Get-Content caprica/vcpkg.json -Raw | ConvertFrom-Json
          $manifest.'builtin-baseline' = $env:VCPKG_COMMIT
          $manifest | ConvertTo-Json -Depth 10 | Set-Content caprica/vcpkg.json -Encoding utf8
          cmake -S caprica -B caprica/build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-release `
            -DVCPKG_HOST_TRIPLET=x64-windows-static-release `
            -DCAPRICA_USE_STATIC_RUNTIME=ON
          if ($LASTEXITCODE -ne 0) { throw "Caprica configure failed" }
          cmake --build caprica/build
          if ($LASTEXITCODE -ne 0) { throw "Caprica build failed" }
          $exe = Get-ChildItem -Recurse -Path caprica/build -Filter Caprica.exe | Select-Object -First 1
          if (-not $exe) { throw "Caprica.exe not found" }
          "CAPRICA_EXE=$($exe.FullName)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Fetch Papyrus headers (Skyrim, SKSE, SkyUI, UIExtensions)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git clone --filter=blob:none --sparse https://github.com/MrOctopus/nl_online.git nl_online
          git -C nl_online checkout $env:NL_ONLINE_COMMIT
          git -C nl_online sparse-checkout set sse/source skse64/source skyui/source
          git clone --filter=blob:none https://github.com/Rukan/Grimy-Skyrim-Papyrus-Source.git grimy
          git -C grimy checkout $env:GRIMY_COMMIT
          New-Item -ItemType Directory -Force -Path papyrus-headers/uiextensions | Out-Null
          Copy-Item grimy/uiextensions.psc, grimy/uimenubase.psc papyrus-headers/uiextensions/
          Copy-Item wrapper/papyrus/headers/*.psc papyrus-headers/uiextensions/

      - name: Compile Papyrus scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $src = (Resolve-Path soes/contrib/Distribution/PapyrusSources).Path
          $out = New-Item -ItemType Directory -Force -Path package/Scripts
          $flags = (Resolve-Path nl_online/sse/source/TESV_Papyrus_Flags.flg).Path
          $scripts = @("skyoutequsysquicksloteffect.psc", "skyoutequsysmcm.psc") | ForEach-Object { Join-Path $src $_ }
          & $env:CAPRICA_EXE --game skyrim -f $flags `
            -i $src `
            -i (Resolve-Path papyrus-headers/uiextensions).Path `
            -i (Resolve-Path nl_online/skyui/source).Path `
            -i (Resolve-Path nl_online/skse64/source).Path `
            -i (Resolve-Path nl_online/sse/source).Path `
            -o $out.FullName --release --final @scripts
          if ($LASTEXITCODE -ne 0) { throw "Papyrus compile failed" }
          Get-ChildItem package/Scripts | ForEach-Object { "$($_.Name)  $($_.Length) bytes" }

      - name: Translations (body-slot numbers)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dst = New-Item -ItemType Directory -Force -Path package/Interface/Translations
          python wrapper/tools/translations.py `
            soes/contrib/Distribution/Translations/interface/translations/skyrimoutfitequipmentsystemng_english.txt `
            (Join-Path $dst.FullName skyrimoutfitequipmentsystemng_english.txt)
          if ($LASTEXITCODE -ne 0) { throw "Translation rewrite failed" }

      - name: Package as a mod (SKSE/Plugins/...)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = "package/SKSE/Plugins"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $dll = Get-ChildItem -Recurse -Path soes/build/release-msvc -Filter SkyrimOutfitEquipmentSystemNG.dll | Select-Object -First 1
          if (-not $dll) { throw "DLL not found" }
          Copy-Item $dll.FullName $out
          $pdb = Get-ChildItem -Recurse -Path soes/build/release-msvc -Filter SkyrimOutfitEquipmentSystemNG.pdb | Select-Object -First 1
          if ($pdb) { Copy-Item $pdb.FullName $out }
          Copy-Item wrapper/README.md package/README-1.7.104-rebuild.md
          Get-ChildItem -Recurse package | ForEach-Object { $_.FullName }

      - name: Upload mod package
        uses: actions/upload-artifact@v4
        with:
          name: SOES-NG-1.7.104-rebuild
          path: package/
          if-no-files-found: error
